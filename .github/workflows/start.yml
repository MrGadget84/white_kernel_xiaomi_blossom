name: Kernel Build Final

on:
  push:
    branches:
      - perf
  workflow_dispatch:

env:
  CCACHE_DIR: /tmp/ccache
  DEFCONFIG: blossom

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Notify start on Telegram
        run: |
          VERSION=$(awk -F'=' '/^VERSION[[:space:]]*=/ {v=$2} /^PATCHLEVEL[[:space:]]*=/ {p=$2} /^SUBLEVEL[[:space:]]*=/ {s=$2} END {gsub(/^[ \t]+|[ \t]+$/,"",v); gsub(/^[ \t]+|[ \t]+$/,"",p); gsub(/^[ \t]+|[ \t]+$/,"",s); printf "%s.%s.%s", v, p, s}' Makefile)
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            --data-urlencode "text=☢️ *Kernel Build Started!*
            *Device:* Blossom
            *Version:* $VERSION" \
            -d parse_mode=Markdown

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev lld llvm gcc g++ python2 ninja-build zip ccache
          sudo ln -sf /usr/bin/ld.lld /usr/bin/ld || true
          sudo ln -sf "/usr/bin/python2" /usr/bin/python
          git clone --depth=1 https://github.com/kdrag0n/proton-clang -b master clang
          git clone --depth=1 https://github.com/Sakurajima07/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/Sakurajima07/arm-linux-androideabi-4.9 gcc

      - name: Build the kernel and log output
        run: |
          mkdir -p out
          START=$(date +%s)
          export ARCH=arm64
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc/bin:$PATH"
          find . -name "Makefile*" -type f -exec sed -i 's/-Werror//g' {} +
          make O=out ${DEFCONFIG}_defconfig
          sed -i 's/CONFIG_FRAME_WARN=[0-9]*/CONFIG_FRAME_WARN=8192/g' out/.config
          make -j$(nproc --all) O=out \
            CC=clang HOSTCC=gcc HOSTCXX=g++ \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE=aarch64-linux-android- \
            KBUILD_WERROR=0 2>&1 | tee build.log || exit 1
          echo "BUILD_TIME=$(($(date +%s) - START))" >> $GITHUB_ENV

      - name: Create AnyKernel3 Zip
        if: success()
        run: |
          git clone --depth=1 https://github.com ak3
          # Настройка под Blossom
          sed -i 's/device.name1=maguro/device.name1=blossom/g' ak3/anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot|block=/dev/block/by-name/boot|g' ak3/anykernel.sh
          
          # Копируем ядро (приоритет Image.gz-dtb, если есть)
          [ -f out/arch/arm64/boot/Image.gz-dtb ] && cp out/arch/arm64/boot/Image.gz-dtb ak3/Image.gz || cp out/arch/arm64/boot/Image.gz ak3/Image.gz
          # Копируем DTBO
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img ak3/
          
          cd ak3 && zip -r9 ../blossom-kernel.zip * -x .git* README.md
          echo "ZIP_MD5=$(md5sum ../blossom-kernel.zip | cut -d ' ' -f1)" >> $GITHUB_ENV

      - name: Notify success on Telegram
        if: success()
        run: |
          curl -s -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -F document=@blossom-kernel.zip \
            -F caption="✅ *Build Successful!*
            ⏱ *Time:* ${BUILD_TIME}s
            🔐 *MD5:* \`${ZIP_MD5}\`" \
            -F parse_mode=Markdown \
            https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument

      - name: Notify failure on Telegram
        if: failure()
        run: |
          [ -f build.log ] && curl -s -F document=@build.log -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} -F caption="❌ Build failed" https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument || echo "No log"

