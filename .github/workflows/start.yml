name: Start

on:
  push:
    branches:
      - perf
  workflow_dispatch:

env:
  CCACHE_DIR: /tmp/ccache
  DEFCONFIG: blossom

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends \
            git build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev lld llvm gcc g++ python2 ninja-build zip ccache curl
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          git clone --depth=1 https://github.com -b master clang
          git clone --depth=1 https://github.com gcc64
          git clone --depth=1 https://github.com gcc

      - name: Setup KernelSU
        run: |
          # Вместо битого скрипта используем нормальный клон
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # Если скрипт выше все равно выдает дичь, вручную проверяем конфиг
          echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ env.DEFCONFIG }}
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/${{ env.DEFCONFIG }}
          echo "✅ KernelSU setup finished"

      - name: Build the kernel
        run: |
          mkdir -p out
          START=$(date +%s)
          export ARCH=arm64
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc/bin:$PATH"
          
          find . -name "Makefile*" -exec sed -i 's/-Werror//g' {} +
          
          make O=out ARCH=arm64 ${{ env.DEFCONFIG }}
          sed -i 's/CONFIG_FRAME_WARN=[0-9]*/CONFIG_FRAME_WARN=8192/g' out/.config
          
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE=aarch64-linux-android- \
            KBUILD_WERROR=0 2>&1 | tee build.log || (tail -n 100 build.log && exit 1)
          
          echo "BUILD_TIME=$(($(date +%s) - START))" >> $GITHUB_ENV

      - name: Pack with AnyKernel3
        if: success()
        run: |
          git clone --depth=1 https://github.com/Sakurajima07/AnyKernel3_blossom ak3
          sed -i 's/device.name1=maguro/device.name1=blossom/g' ak3/anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot|block=/dev/block/by-name/boot|g' ak3/anykernel.sh
          
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb ak3/Image.gz
          else
            cp out/arch/arm64/boot/Image.gz ak3/Image.gz
          fi
          
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img ak3/
          
          cd ak3 && zip -r9 ../WhiteKernel-Blossom-KSU.zip * -x .git* README.md

      - name: Send Flashable ZIP to Telegram
        if: success()
        run: |
          MD5=$(md5sum WhiteKernel-Blossom-KSU.zip | cut -d ' ' -f1)
          curl -s -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -F document=@WhiteKernel-Blossom-KSU.zip \
            -F caption="✅ *KernelSU Build Ready!*
            📱 *Device:* Blossom
            ⏱ *Time:* ${BUILD_TIME}s
            🔐 *MD5:* \`$MD5\`" \
            -F parse_mode=Markdown \
            https://api.telegram.org{{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument

      - name: Notify Failure
        if: failure()
        run: |
          [ -f build.log ] && curl -s -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -F document=@build.log \
            -F caption="❌ Сборка сдохла. См. лог." \
            https://api.telegram.org{{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument || echo "Log not found"


