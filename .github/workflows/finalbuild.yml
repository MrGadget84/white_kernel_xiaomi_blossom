name: Final Build (KSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential flex bison lld llvm clang libssl-dev libelf-dev zip curl

    - name: Notify Telegram (Start)
      run: |
        curl -s -X POST https://api.telegram.org{{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
        -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
        -d text="🚀 Сборка WhiteKernel для Blossom (MT6765) запущена! Включаю KernelSU..."

    - name: Setup KernelSU
      run: |
        curl -LSs "https://raw.githubusercontent.com" | bash -s main
        # Проверь имя конфига! Если он в подпапке, укажи полный путь, например: arch/arm64/configs/vendor/blossom_defconfig
        DEFCONFIG="arch/arm64/configs/blossom_defconfig"
        echo "CONFIG_KSU=y" >> $DEFCONFIG
        echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG

    - name: Build Kernel
      run: |
        export ARCH=arm64
        # Здесь подставь свое имя конфига вместо blossom_defconfig
        make O=out ARCH=arm64 blossom_defconfig
        make -j$(nproc --all) O=out ARCH=arm64 \
             CC=clang \
             CROSS_COMPILE=aarch64-linux-gnu- \
             CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Pack AnyKernel3
      if: success()
      run: |
        git clone --depth=1 https://github.com
        cd AnyKernel3
        sed -i 's/device.name1=maguro/device.name1=blossom/g' anykernel.sh
        sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot|block=/dev/block/by-name/boot|g' anykernel.sh
        
        # Берем Image.gz-dtb если есть, иначе обычный Image.gz
        if [ -f ../out/arch/arm64/boot/Image.gz-dtb ]; then
          cp ../out/arch/arm64/boot/Image.gz-dtb ./Image.gz
        else
          cp ../out/arch/arm64/boot/Image.gz ./Image.gz
        fi
        
        [ -f ../out/arch/arm64/boot/dtbo.img ] && cp ../out/arch/arm64/boot/dtbo.img .
        
        zip -r9 ../WhiteKernel-KSU-Blossom.zip * -x .git* README.md

    - name: Send to Telegram (Success)
      if: success()
      run: |
        curl -v -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
             -F "document=@WhiteKernel-KSU-Blossom.zip" \
             -F "caption=✅ Ядро собрано! Устройство: Blossom. Root: KernelSU готов." \
             https://api.telegram.org{{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument

    - name: Notify Telegram (Failure)
      if: failure()
      run: |
        curl -s -X POST https://api.telegram.org{{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
        -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
        -d text="❌ Ошибка сборки! Проверь логи в GitHub Actions."

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: WhiteKernel-KSU-Blossom
        path: WhiteKernel-KSU-Blossom.zip
