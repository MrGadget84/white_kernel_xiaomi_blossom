name: Build WhiteKernel Blossom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential flex bison lld llvm clang libssl-dev libelf-dev zip curl

    - name: Setup KernelSU
      run: |
        curl -LSs "https://raw.githubusercontent.com" | bash -s main
        # Проверь, чтобы имя конфига было верным
        echo "CONFIG_KSU=y" >> arch/arm64/configs/blossom_defconfig
        echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/blossom_defconfig

    - name: Build Kernel
      run: |
        export ARCH=arm64
        make O=out ARCH=arm64 blossom_defconfig
        make -j$(nproc --all) O=out ARCH=arm64 \
             CC=clang \
             CROSS_COMPILE=aarch64-linux-gnu- \
             CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Pack AnyKernel3
      if: success()
      run: |
        git clone --depth=1 https://github.com
        cd AnyKernel3
        sed -i 's/device.name1=maguro/device.name1=blossom/g' anykernel.sh
        sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot|block=/dev/block/by-name/boot|g' anykernel.sh
        
        # Копируем ядро из папки out
        if [ -f ../out/arch/arm64/boot/Image.gz-dtb ]; then
          cp ../out/arch/arm64/boot/Image.gz-dtb ./Image.gz
        else
          cp ../out/arch/arm64/boot/Image.gz ./Image.gz
        fi
        [ -f ../out/arch/arm64/boot/dtbo.img ] && cp ../out/arch/arm64/boot/dtbo.img .
        
        zip -r9 ../WhiteKernel-Blossom.zip *

    - name: Send to Telegram
      if: success()
      env:
        TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        curl -F "chat_id=$CHAT" -F "document=@WhiteKernel-Blossom.zip" \
        -F "caption=✅ Сборка готова!" \
        "https://api.telegram.org"

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: WhiteKernel-Blossom
        path: WhiteKernel-Blossom.zip
