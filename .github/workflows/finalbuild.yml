name: Build WhiteKernel Blossom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Выносим секреты в переменные окружения один раз на весь джоб
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential flex bison lld llvm clang libssl-dev libelf-dev zip curl

    - name: Notify Telegram (Start)
      run: |
        curl -s -X POST "https://api.telegram.org{BOT_TOKEN}/sendMessage" \
        -d chat_id="${CHAT_ID}" \
        -d text="🚀 Сборка запущена! KernelSU ставим, ядро Blossom (MT6765) собираем."

    - name: Setup KernelSU
      run: |
        curl -LSs "https://raw.githubusercontent.com" | bash -s main
        # Проверь, чтобы blossom_defconfig реально был в arch/arm64/configs/
        DEFCONFIG="arch/arm64/configs/blossom_defconfig"
        echo "CONFIG_KSU=y" >> $DEFCONFIG
        echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG

    - name: Build Kernel
      run: |
        export ARCH=arm64
        make O=out ARCH=arm64 blossom_defconfig
        make -j$(nproc --all) O=out ARCH=arm64 \
             CC=clang \
             CROSS_COMPILE=aarch64-linux-gnu- \
             CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Pack AnyKernel3
      if: success()
      run: |
        git clone --depth=1 https://github.com
        cd AnyKernel3
        sed -i 's/device.name1=maguro/device.name1=blossom/g' anykernel.sh
        sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot|block=/dev/block/by-name/boot|g' anykernel.sh
        
        # Копируем что собралось
        if [ -f ../out/arch/arm64/boot/Image.gz-dtb ]; then
          cp ../out/arch/arm64/boot/Image.gz-dtb ./Image.gz
        else
          cp ../out/arch/arm64/boot/Image.gz ./Image.gz
        fi
        [ -f ../out/arch/arm64/boot/dtbo.img ] && cp ../out/arch/arm64/boot/dtbo.img .
        
        zip -r9 ../WhiteKernel-Blossom.zip *

    - name: Send Document to Telegram
      if: success()
      run: |
        curl -v -F "chat_id=${CHAT_ID}" \
             -F "document=@WhiteKernel-Blossom.zip" \
             -F "caption=✅ Готово! Ядро Blossom с KernelSU." \
             "https://api.telegram.org{BOT_TOKEN}/sendDocument"

    - name: Notify Telegram (Failure)
      if: failure()
      run: |
        curl -s -X POST "https://api.telegram.org{BOT_TOKEN}/sendMessage" \
        -d chat_id="${CHAT_ID}" \
        -d text="❌ Сборка обосралась. Иди смотри логи в Actions."

