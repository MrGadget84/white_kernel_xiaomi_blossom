name: Build WhiteKernel Blossom with KSU & Telegram

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential flex bison lld llvm clang libssl-dev libelf-dev zip curl

    - name: Notify Telegram (Start)
      run: |
        curl -s -X POST https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage \
        -d chat_id=${{ secrets.TG_CHAT_ID }} \
        -d text="🚀 Сборка WhiteKernel для Blossom запущена! Начинаю установку KernelSU..."

    - name: Setup KernelSU
      run: |
        curl -LSs "https://raw.githubusercontent.com" | bash -s main
        # Замени blossom_defconfig на реальное имя твоего конфига
        DEFCONFIG="arch/arm64/configs/blossom_defconfig"
        echo "CONFIG_KSU=y" >> $DEFCONFIG
        echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG

    - name: Build Kernel
      run: |
        export ARCH=arm64
        make O=out ARCH=arm64 blossom_defconfig
        make -j$(nproc --all) O=out ARCH=arm64 \
             CC=clang \
             CROSS_COMPILE=aarch64-linux-gnu- \
             CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Pack AnyKernel3
      run: |
        git clone --depth=1 https://github.com
        cd AnyKernel3
        sed -i 's/device.name1=maguro/device.name1=blossom/g' anykernel.sh
        sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot|block=/dev/block/by-name/boot|g' anykernel.sh
        
        # Выбор ядра (Image.gz-dtb или Image.gz)
        [ -f ../out/arch/arm64/boot/Image.gz-dtb ] && cp ../out/arch/arm64/boot/Image.gz-dtb ./Image.gz || cp ../out/arch/arm64/boot/Image.gz ./Image.gz
        [ -f ../out/arch/arm64/boot/dtbo.img ] && cp ../out/arch/arm64/boot/dtbo.img .
        
        zip -r9 ../WhiteKernel-KSU-Blossom.zip * -x .git* README.md

    - name: Send to Telegram (Finish)
      if: success()
      run: |
        curl -v -F "chat_id=${{ secrets.TG_CHAT_ID }}" \
             -F "document=@WhiteKernel-KSU-Blossom.zip" \
             -F "caption=✅ Ядро успешно собрано! Устройство: Blossom (MT6765). Root: KernelSU включен." \
             https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendDocument

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WhiteKernel-KSU-Blossom
        path: WhiteKernel-KSU-Blossom.zip
