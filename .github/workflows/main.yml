jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          path: kernel

      - name: Run your setup script (without make)
        run: |
          cd kernel
          # твои шаги для подготовки (curl, патчи, sed)
          # но без сборки (без make)
          
      - name: Show duplicates
        run: |
          cd kernel
          grep -n "susfs_alloc" fs/namespace.c
